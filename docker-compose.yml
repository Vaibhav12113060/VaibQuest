services:
  backend:
    build: ./Backend
    env_file:
      - ./Backend/.env
    ports:
      - "8000:8000"
    depends_on:
      - redis

  frontend:
    build: ./Frontend
    env_file:
      - ./Frontend/.env
    ports:
      - "5173:5173"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
